<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Decision processes for human–AI interaction</title>
  <desc id="desc">Decision-process models and neural networks can use behavioral process data to build better human–AI interactions.</desc>
  <rect width="760" height="220" rx="18" fill="#173b35"/>
  <text x="28" y="31" fill="#dff276" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">PROCESS DATA BRIDGES MINDS AND MACHINES</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="32" y="69" width="165" height="88" rx="13" fill="#f7f3e9"/><text x="114" y="98" fill="#173b35" font-size="14" font-weight="700">BEHAVIOR</text><text x="114" y="121" fill="#54726a" font-size="12">choices · response times</text><text x="114" y="140" fill="#54726a" font-size="12">gaze · neural signals</text>
    <path d="M199 113h45m-8-6 8 6-8 6" fill="none" stroke="#dff276" stroke-width="2"/>
    <rect x="250" y="57" width="198" height="54" rx="12" fill="#28554c" stroke="#78b9ab"/><text x="349" y="90" fill="#f7f3e9" font-size="14" font-weight="700">DECISION MODELS</text>
    <rect x="250" y="127" width="198" height="54" rx="12" fill="#28554c" stroke="#ee795c"/><text x="349" y="160" fill="#f7f3e9" font-size="14" font-weight="700">NEURAL NETWORKS</text>
    <path d="M449 84h47v29h20m-20 0v42h20" fill="none" stroke="#dff276" stroke-width="2"/><path d="M489 107h26m-8-6 8 6-8 6M489 151h26m-8-6 8 6-8 6" fill="none" stroke="#dff276" stroke-width="2"/>
    <rect x="542" y="72" width="190" height="82" rx="14" fill="#ee795c"/><text x="637" y="104" fill="#173b35" font-size="14" font-weight="700">HUMAN–AI</text><text x="637" y="128" fill="#173b35" font-size="13">INTERACTION</text>
  </g>
</svg>
