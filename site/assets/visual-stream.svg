<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Comparing image categories along the ventral visual stream</title>
  <desc id="desc">Natural and man-made images are compared from early visual cortex through higher-level ventral regions.</desc>
  <rect width="760" height="220" rx="18" fill="#173b35"/>
  <text x="28" y="31" fill="#dff276" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">IMAGE CATEGORY × VISUAL REGION</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="32" y="71" width="106" height="94" rx="12" fill="#28554c" stroke="#78b9ab"/><circle cx="75" cy="111" r="19" fill="#78b9ab"/><path d="M97 125l14-28 13 28z" fill="#dff276"/><text x="85" y="151" fill="#f7f3e9" font-size="11">NATURAL</text>
    <rect x="151" y="71" width="106" height="94" rx="12" fill="#28554c" stroke="#ee795c"/><rect x="175" y="94" width="25" height="28" rx="2" fill="#ee795c"/><rect x="207" y="101" width="27" height="21" fill="#dff276"/><text x="204" y="151" fill="#f7f3e9" font-size="11">MAN-MADE</text>
    <path d="M263 118h48m-8-6 8 6-8 6" fill="none" stroke="#dff276" stroke-width="2"/>
    <path d="M336 76c-9 19-9 51 0 81M365 76c-6 20-6 51 0 81M394 76c-3 20-3 51 0 81M423 76c-1 20-1 51 0 81M452 76c-1 20-1 51 0 81" fill="none" stroke="#78b9ab" stroke-width="5" stroke-linecap="round"/>
    <g fill="#f7f3e9" font-size="11"><text x="350" y="180">V1 / V2</text><text x="406" y="180">V4</text><text x="457" y="180">IT / LOC</text></g>
    <path d="M490 118h44m-8-6 8 6-8 6" fill="none" stroke="#dff276" stroke-width="2"/>
    <rect x="545" y="73" width="183" height="87" rx="13" fill="#f7f3e9"/><path d="M568 130v-38m0 38h135" stroke="#54726a" stroke-width="1.5"/><path d="M579 118c20-2 24-11 40-12s21 4 37-8 25-7 39-14" fill="none" stroke="#ee795c" stroke-width="3"/><path d="M579 127c18-1 25-6 40-7s23 0 36-5 25-7 40-7" fill="none" stroke="#245a50" stroke-width="3"/><text x="628" y="183" fill="#c8e1d6" font-size="11">regional representations</text>
  </g>
