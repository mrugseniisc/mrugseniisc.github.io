<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Testing process cues in language models</title>
  <desc id="desc">Human choice, response time and eye movements provide clues to a language model that estimates hidden preferences.</desc>
  <rect width="760" height="220" rx="18" fill="#173b35"/>
  <text x="28" y="31" fill="#dff276" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">HUMAN TRACE → MODEL INFERENCE</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g font-size="12"><rect x="28" y="58" width="158" height="34" rx="8" fill="#f7f3e9"/><rect x="28" y="101" width="158" height="34" rx="8" fill="#f7f3e9"/><rect x="28" y="144" width="158" height="34" rx="8" fill="#f7f3e9"/><text x="107" y="80" fill="#173b35">01 · CHOICE</text><text x="107" y="123" fill="#173b35">02 · RESPONSE TIME</text><text x="107" y="166" fill="#173b35">03 · EYE MOVEMENTS</text></g>
    <g stroke="#78b9ab" stroke-width="2"><path d="M187 75h63l12 24" fill="none"/><path d="M187 118h70" fill="none"/><path d="M187 161h63l12-24" fill="none"/></g>
    <rect x="264" y="73" width="202" height="92" rx="14" fill="#28554c" stroke="#78b9ab"/><text x="365" y="108" fill="#dff276" font-size="15" font-weight="700">LANGUAGE MODEL</text><text x="365" y="132" fill="#c8e1d6" font-size="12">Which cues are used?</text>
    <path d="M467 119h56m-8-6 8 6-8 6" stroke="#dff276" stroke-width="2" fill="none"/>
    <rect x="526" y="73" width="204" height="92" rx="14" fill="#ee795c"/><text x="628" y="108" fill="#173b35" font-size="14" font-weight="700">HIDDEN PREFERENCES</text><text x="628" y="132" fill="#173b35" font-size="12">estimate + offer quality</text>
  </g>
</svg>
