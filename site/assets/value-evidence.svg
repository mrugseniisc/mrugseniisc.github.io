<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">From value to decision evidence</title>
  <desc id="desc">A value signal is transformed into accumulating evidence and a choice; the research examines how affective symptoms relate to this process.</desc>
  <rect width="760" height="220" rx="18" fill="#173b35"/>
  <text x="28" y="31" fill="#dff276" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">VALUE-TO-EVIDENCE TRANSLATION</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="32" y="70" width="130" height="82" rx="12" fill="#f7f3e9"/><text x="97" y="101" fill="#173b35" font-size="14" font-weight="700">VALUE</text><text x="97" y="125" fill="#54726a" font-size="12">option A vs. B</text>
    <path d="M164 111h62m-8-6 8 6-8 6" fill="none" stroke="#dff276" stroke-width="2"/>
    <rect x="234" y="55" width="260" height="112" rx="14" fill="#28554c" stroke="#78b9ab"/><text x="364" y="79" fill="#dff276" font-size="13" font-weight="700">EVIDENCE ACCUMULATION</text>
    <path d="M258 141 296 132 327 135 356 105 387 115 416 92 445 98 470 82" fill="none" stroke="#f7f3e9" stroke-width="3"/><path d="M258 153h212" stroke="#78b9ab" stroke-width="1"/><path d="M470 81v72" stroke="#ee795c" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M496 111h54m-8-6 8 6-8 6" fill="none" stroke="#dff276" stroke-width="2"/>
    <rect x="558" y="70" width="166" height="82" rx="12" fill="#ee795c"/><text x="641" y="101" fill="#173b35" font-size="14" font-weight="700">CHOICE</text><text x="641" y="125" fill="#173b35" font-size="12">A or B</text>
    <text x="366" y="194" fill="#c8e1d6" font-size="11">studied in relation to anxiety and depression</text>
  </g>
</svg>
